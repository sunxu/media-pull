name: Build public media image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest
        type: string
      manifest_url:
        description: Optional non-secret manifest URL; leave blank to use the MANIFEST_URL secret
        required: false
        default: ""
        type: string
      concurrency:
        description: Parallel downloads
        required: true
        default: "8"
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/media-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate inputs
        id: input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          DOWNLOAD_JOBS: ${{ inputs.concurrency }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          [[ "$DOWNLOAD_JOBS" =~ ^[1-9][0-9]*$ ]] && (( DOWNLOAD_JOBS <= 64 )) || { echo "Concurrency must be 1..64" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download and prepare layers
        env:
          MANIFEST_URL: ${{ inputs.manifest_url || secrets.MANIFEST_URL }}
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_TOKEN }}
          JOBS: ${{ inputs.concurrency }}
        run: python3 scripts/prepare.py --manifest-url "$MANIFEST_URL" --jobs "$JOBS"

      - name: Show build report
        if: always()
        run: test ! -f .media-build/report.md || cat .media-build/report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-build-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .media-build/report.md
          if-no-files-found: ignore

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish scratch image
        uses: docker/build-push-action@v7
        with:
          context: .media-build/context
          file: .media-build/context/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.input.outputs.tag }}
